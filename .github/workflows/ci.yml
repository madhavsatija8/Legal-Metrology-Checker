name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The compliance/OCR pipeline needs the real tesseract binary — several
      # tests (test_ocr_pipeline.py, test_report_generation.py,
      # test_api_e2e_pipeline.py) skip themselves if it's missing, but we
      # want them actually running in CI, not silently skipped.
      - name: Install tesseract-ocr
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run backend test suite
        working-directory: backend
        run: pytest -v

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npm run lint

      - name: Run frontend test suite
        working-directory: frontend
        run: npm test

      - name: Build production bundle
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: https://api.example.invalid

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t legal-metrology-backend:ci ./backend

      - name: Build frontend image
        run: |
          docker build \
            --build-arg VITE_API_URL=https://api.example.invalid \
            -t legal-metrology-frontend:ci \
            ./frontend
