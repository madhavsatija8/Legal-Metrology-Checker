server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # react-router uses client-side routing (see src/App.tsx's <Routes>) —
    # any path that isn't a real static file should fall back to
    # index.html and let the app's own router decide what to show,
    # otherwise a hard refresh on e.g. /scans/abc-123 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints built JS/CSS filenames (e.g. index-a1b2c3d4.js), so
    # they're safe to cache aggressively — a new deploy gets new filenames.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
